name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The whole suite replays the committed archive fixtures. Forcing offline
      # mode in CI is not just for speed: it proves the claim that a fresh clone
      # reproduces every result without network, and it means a flaky third-party
      # API can never turn into a red build on this repository.
      - run: pytest -q
        env:
          DENDRO_OFFLINE: "1"
