[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dendro-provenance"
version = "0.1.0"
description = "Prove a document existed before a date from independent archives, instead of guessing whether it looks generated."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Dendro contributors" }]
keywords = [
  "provenance",
  "data-curation",
  "near-duplicate-detection",
  "minhash",
  "web-archives",
  "low-background",
  "dataset-contamination",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
# The core needs numpy and scipy only.  Everything that reaches the network is
# behind `requests`, and everything that reads a dataset is behind `datasets`,
# so `import dendro` stays cheap and an offline replay needs neither.
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
net = ["requests>=2.28"]
bench = ["pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.2", "requests>=2.28"]
app = ["gradio>=5.0", "matplotlib>=3.7", "requests>=2.28"]
hub = ["datasets>=2.14", "huggingface_hub>=0.20"]
dev = ["pytest>=7.4", "matplotlib>=3.7", "scikit-learn>=1.2", "requests>=2.28", "datasets>=2.14"]
all = [
  "requests>=2.28",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.2",
  "gradio>=5.0",
  "datasets>=2.14",
  "huggingface_hub>=0.20",
  "pytest>=7.4",
]

[project.scripts]
dendro = "dendro.cli:main"

[project.urls]
Homepage = "https://github.com/NagaYu/dendro"
Repository = "https://github.com/NagaYu/dendro"
"Hugging Face Space" = "https://huggingface.co/spaces/NagaYu/dendro"

[tool.setuptools.packages.find]
include = ["dendro*", "benchmarks*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: long-running benchmark validation (deselect with '-m \"not slow\"')"]
